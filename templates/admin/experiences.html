{% extends "admin/base.html" %}

{% block title %}Experience - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Work Experience</h1>
    <a href="{{ url_for('admin.new_experience') }}" class="btn btn-primary">Add Experience</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Title</th>
            <th>Company</th>
            <th>Period</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for exp in experiences %}
        <tr>
            <td>{{ exp.title }}</td>
            <td>{{ exp.company }}</td>
            <td>{{ exp.period }}</td>
            <td>
                <a href="{{ url_for('admin.edit_experience', id=exp.id) }}" class="btn btn-sm btn-primary">Edit</a>
                <form method="POST" action="{{ url_for('admin.delete_experience', id=exp.id) }}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
