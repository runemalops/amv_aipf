{% extends "admin/base.html" %}

{% block title %}Blog Posts - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Blog Posts</h1>
    <a href="{{ url_for('admin.new_blog_post') }}" class="btn btn-primary">Add Blog Post</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for post in posts %}
        <tr>
            <td>{{ post.title }}</td>
            <td><span class="badge bg-primary">{{ post.category }}</span></td>
            <td>{{ post.date.strftime('%Y-%m-%d') }}</td>
            <td>
                <a href="{{ url_for('admin.edit_blog_post', id=post.id) }}" class="btn btn-sm btn-primary">Edit</a>
                <form method="POST" action="{{ url_for('admin.delete_blog_post', id=post.id) }}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
