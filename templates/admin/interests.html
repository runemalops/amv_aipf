{% extends "admin/base.html" %}

{% block title %}Interests - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Interests</h1>
    <a href="{{ url_for('admin.new_interest') }}" class="btn btn-primary">Add Interest</a>
</div>

<div class="card">
    <div class="card-body">
        {% if interests %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for interest in interests %}
                <tr>
                    <td>{{ interest.name }}</td>
                    <td>
                        <a href="{{ url_for('admin.edit_interest', id=interest.id) }}" class="btn btn-sm btn-secondary">Edit</a>
                        <form action="{{ url_for('admin.delete_interest', id=interest.id) }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-muted">No interests yet.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
