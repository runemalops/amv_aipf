{% extends "admin/base.html" %}

{% block title %}{{ 'Edit' if link else 'New' }} Social Link - Admin{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Edit' if link else 'New' }} Social Link</h1>

<form method="POST">
    <h5 class="mb-3">English</h5>
    <div class="mb-3">
        <label for="platform" class="form-label">Platform Name</label>
        <input type="text" class="form-control" id="platform" name="platform" value="{{ link.platform if link else '' }}" placeholder="e.g., GitHub, YouTube, LinkedIn" required>
    </div>
    <hr>
    <h5 class="mb-3">Spanish <button type="button" class="btn btn-sm btn-info" onclick="translateSocialLinkToSpanish()">Auto-Translate from English</button></h5>
    <div class="mb-3">
        <label for="platform_es" class="form-label">Platform Name (Spanish)</label>
        <input type="text" class="form-control" id="platform_es" name="platform_es" value="{{ link.translations.es.platform if link and link.translations and link.translations.es else '' }}" placeholder="e.g., GitHub, YouTube, LinkedIn">
    </div>
    <hr>
    <h5 class="mb-3">Common</h5>
    <div class="mb-3">
        <label for="url" class="form-label">URL</label>
        <input type="url" class="form-control" id="url" name="url" value="{{ link.url if link else '' }}" placeholder="https://..." required>
    </div>
    <div class="mb-3">
        <label for="icon" class="form-label">Icon (Bootstrap Icons class)</label>
        <input type="text" class="form-control" id="icon" name="icon" value="{{ link.icon if link else '' }}" placeholder="e.g., bi-github, bi-youtube, bi-linkedin">
        <small class="text-muted">Use Bootstrap Icons class names</small>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin.social_links') }}" class="btn btn-secondary">Cancel</a>
</form>

<script src="{{ url_for('static', filename='js/translate.js') }}"></script>
<script>
async function translateSocialLinkToSpanish() {
    const platform = document.getElementById('platform').value;
    
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Translating...';
    
    try {
        if (platform) {
            document.getElementById('platform_es').value = await translateToSpanish(platform, '/admin/translate');
        }
    } catch (e) {
        alert('Translation failed. Please try again.');
    }
    
    btn.disabled = false;
    btn.textContent = 'Auto-Translate from English';
}
</script>
{% endblock %}
