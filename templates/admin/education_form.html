{% extends "admin/base.html" %}

{% block title %}{{ 'Edit' if education else 'Add' }} Education - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>{{ 'Edit' if education else 'Add' }} Education</h1>
    <a href="{{ url_for('admin.educations') }}" class="btn btn-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <h5 class="mb-3">English</h5>
            <div class="mb-3">
                <label for="degree" class="form-label">Degree</label>
                <input type="text" class="form-control" id="degree" name="degree" value="{{ education.degree if education else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="school" class="form-label">School</label>
                <input type="text" class="form-control" id="school" name="school" value="{{ education.school if education else '' }}" required>
            </div>
            <hr>
            <h5 class="mb-3">Spanish <button type="button" class="btn btn-sm btn-info" onclick="translateEducationToSpanish()">Auto-Translate from English</button></h5>
            <div class="mb-3">
                <label for="degree_es" class="form-label">Degree (Spanish)</label>
                <input type="text" class="form-control" id="degree_es" name="degree_es" value="{{ education.translations.es.degree if education and education.translations and education.translations.es else '' }}">
            </div>
            <div class="mb-3">
                <label for="school_es" class="form-label">School (Spanish)</label>
                <input type="text" class="form-control" id="school_es" name="school_es" value="{{ education.translations.es.school if education and education.translations and education.translations.es else '' }}">
            </div>
            <hr>
            <h5 class="mb-3">Common</h5>
            <div class="mb-3">
                <label for="year" class="form-label">Year</label>
                <input type="text" class="form-control" id="year" name="year" value="{{ education.year if education else '' }}" placeholder="e.g., 2018 - 2022" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ 'Update' if education else 'Create' }}</button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/translate.js') }}"></script>
<script>
async function translateEducationToSpanish() {
    const degree = document.getElementById('degree').value;
    const school = document.getElementById('school').value;
    
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Translating...';
    
    try {
        if (degree) {
            document.getElementById('degree_es').value = await translateToSpanish(degree, '/admin/translate');
        }
        if (school) {
            document.getElementById('school_es').value = await translateToSpanish(school, '/admin/translate');
        }
    } catch (e) {
        alert('Translation failed. Please try again.');
    }
    
    btn.disabled = false;
    btn.textContent = 'Auto-Translate from English';
}
</script>
{% endblock %}
