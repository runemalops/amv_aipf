{% extends "admin/base.html" %}

{% block title %}{{ 'Edit' if project else 'New' }} Project - Admin{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Edit' if project else 'New' }} Project</h1>

<form method="POST">
    <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ project.title if project else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="4" required>{{ project.description if project else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label for="technologies" class="form-label">Technologies (comma-separated)</label>
        <input type="text" class="form-control" id="technologies" name="technologies" value="{{ project.technologies if project else '' }}">
    </div>
    <div class="mb-3">
        <label for="link" class="form-label">Project Link</label>
        <input type="url" class="form-control" id="link" name="link" value="{{ project.link if project else '' }}">
    </div>
    <div class="mb-3">
        <label for="demo" class="form-label">Demo Link</label>
        <input type="url" class="form-control" id="demo" name="demo" value="{{ project.demo if project else '' }}">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="featured" name="featured" {{ 'checked' if project and project.featured else '' }}>
        <label class="form-check-label" for="featured">Featured</label>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin.projects') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
