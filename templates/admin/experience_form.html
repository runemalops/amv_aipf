{% extends "admin/base.html" %}

{% block title %}{{ 'Edit' if experience else 'New' }} Experience - Admin{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Edit' if experience else 'New' }} Experience</h1>

<form method="POST">
    <h5 class="mb-3">English Version</h5>
    <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ experience.title if experience else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="company" class="form-label">Company</label>
        <input type="text" class="form-control" id="company" name="company" value="{{ experience.company if experience else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="period" class="form-label">Period</label>
        <input type="text" class="form-control" id="period" name="period" placeholder="2023 - Present" value="{{ experience.period if experience else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="location" class="form-label">Location</label>
        <input type="text" class="form-control" id="location" name="location" value="{{ experience.location if experience else '' }}">
    </div>
    <div class="mb-3">
        <label for="responsibilities" class="form-label">Responsibilities (one per line)</label>
        <textarea class="form-control" id="responsibilities" name="responsibilities" rows="10">{{ experience.responsibilities if experience else '' }}</textarea>
    </div>
    
    <hr class="my-4">
    
    <h5 class="mb-3">Spanish Version <button type="button" class="btn btn-sm btn-info" onclick="translateExperienceToSpanish()">Auto-Translate from English</button></h5>
    <div class="mb-3">
        <label for="title_es" class="form-label">Title (Spanish)</label>
        <input type="text" class="form-control" id="title_es" name="title_es" value="{{ experience.title_es if experience else '' }}">
    </div>
    <div class="mb-3">
        <label for="responsibilities_es" class="form-label">Responsibilities (Spanish - one per line)</label>
        <textarea class="form-control" id="responsibilities_es" name="responsibilities_es" rows="10">{{ experience.responsibilities_es if experience else '' }}</textarea>
    </div>
    
    <hr class="my-4">
    
    <div class="mb-3">
        <label for="technologies" class="form-label">Technologies (comma-separated)</label>
        <input type="text" class="form-control" id="technologies" name="technologies" value="{{ experience.technologies if experience else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin.experiences') }}" class="btn btn-secondary">Cancel</a>
</form>

<script src="{{ url_for('static', filename='js/translate.js') }}"></script>
<script>
async function translateExperienceToSpanish() {
    const title = document.getElementById('title').value;
    const responsibilities = document.getElementById('responsibilities').value;
    
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Translating...';
    
    try {
        if (title) {
            document.getElementById('title_es').value = await translateToSpanish(title, '/admin/translate');
        }
        if (responsibilities) {
            document.getElementById('responsibilities_es').value = await translateToSpanish(responsibilities, '/admin/translate');
        }
    } catch (e) {
        alert('Translation failed. Please try again.');
    }
    
    btn.disabled = false;
    btn.textContent = 'Auto-Translate from English';
}
</script>
{% endblock %}
