{% extends "admin/base.html" %}

{% block title %}{{ 'Edit' if link else 'New' }} Social Link - Admin{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Edit' if link else 'New' }} Social Link</h1>

<form method="POST">
    <div class="mb-3">
        <label for="platform" class="form-label">Platform Name</label>
        <input type="text" class="form-control" id="platform" name="platform" value="{{ link.platform if link else '' }}" placeholder="e.g., GitHub, YouTube, LinkedIn" required>
    </div>
    <div class="mb-3">
        <label for="url" class="form-label">URL</label>
        <input type="url" class="form-control" id="url" name="url" value="{{ link.url if link else '' }}" placeholder="https://..." required>
    </div>
    <div class="mb-3">
        <label for="icon" class="form-label">Icon (Bootstrap Icons class)</label>
        <input type="text" class="form-control" id="icon" name="icon" value="{{ link.icon if link else '' }}" placeholder="e.g., bi-github, bi-youtube, bi-linkedin">
        <small class="text-muted">Use Bootstrap Icons class names</small>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin.social_links') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
