{% extends "admin/base.html" %}

{% block title %}Skills - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Skills</h1>
    <a href="{{ url_for('admin.new_skill') }}" class="btn btn-primary">Add Skill</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for skill in skills %}
        <tr>
            <td>{{ skill.name }}</td>
            <td>{{ skill.category or 'N/A' }}</td>
            <td>
                <a href="{{ url_for('admin.edit_skill', id=skill.id) }}" class="btn btn-sm btn-primary">Edit</a>
                <form method="POST" action="{{ url_for('admin.delete_skill', id=skill.id) }}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
